[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbreaker"
version = "0.1.0"
description = "Offensive probe kit for container build services: find secret, path, network and isolation reachability during image builds"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ritvik Indupuri"}]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
buildbreaker = "buildbreaker.cli:main"

[project.urls]
Homepage = "https://github.com/ritvikindupuri/BuildBreaker"

[tool.setuptools]
packages = ["buildbreaker", "buildbreaker.generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
